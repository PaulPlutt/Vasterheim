<!DOCTYPE html>
<html lang="sv">
<head>
    <title>Västerheim - World Engine</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #0b1d21; color: white; overflow: hidden; }
        #top-bar { background: #0b1d21; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a4d53; z-index: 1001; flex-shrink: 0; }
        #filter-bar { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .filter-btn { padding: 5px 10px; border-radius: 4px; border: 1px solid #447a82; background: #162a2e; color: white; cursor: pointer; font-size: 11px; }
        .filter-btn.active { background: #2ecc71; border-color: white; }
        #dm-status { font-size: 12px; padding: 8px 15px; border-radius: 4px; background: #c0392b; cursor: pointer; font-weight: bold; border: none; color: white; }

        /* ---- NYTT: knapp för att lägga till plats, bara synlig i DM-läge ---- */
        .dm-only-btn { display: none; }
        #add-place-btn { font-size: 12px; padding: 8px 15px; border-radius: 4px; background: #2ecc71; cursor: pointer; font-weight: bold; border: none; color: #0b1d21; margin-right: 8px; }
        #add-place-btn.placing { background: #f1c40f; }

        /* ---- NYTT: rad som håller karta + sidopanel bredvid varandra ---- */
        #content-row { flex-grow: 1; display: flex; flex-direction: row; position: relative; overflow: hidden; min-height: 0; }

        #map { flex-grow: 1; height: 100%; background: #0b1d21; cursor: crosshair; }

        /* ---- NYTT: knappen som fäller ut/in panelen, flyter ovanpå kartan ---- */
        #toggle-editor-btn {
            position: absolute; top: 15px; right: 15px; z-index: 1002;
            background: #2a4d53; color: #8eb0b7; border: 2px solid #447a82;
            padding: 10px 12px; cursor: pointer; font-size: 13px; font-weight: bold;
            border-radius: 5px; transition: right 0.3s;
        }
        #toggle-editor-btn.panel-open { right: 395px; }

        /* ---- ÄNDRAT: panelen är nu en sidopanel (bredd), inte en bottenpanel (höjd) ---- */
        #editor-panel {
            background: #162a2e; padding: 15px; border-left: 3px solid #2a4d53;
            display: flex; flex-direction: column; gap: 12px; z-index: 1001;
            width: 380px; flex-shrink: 0; height: 100%; overflow-y: auto;
            box-sizing: border-box; transition: 0.3s;
        }
        .editor-hidden { width: 0 !important; padding: 0 !important; overflow: hidden !important; border-left: none !important; }

        .editor-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 5px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; font-size: 10px; flex: 1; min-width: 120px; }
        .dm-only-field { display: none; }
        label { color: #8eb0b7; font-weight: bold; text-transform: uppercase; }
        input, select, textarea { background: #2a4d53; border: 1px solid #447a82; color: white; padding: 6px; border-radius: 4px; font-size: 12px; width: 100%; box-sizing: border-box; }

        .npc-box { background: rgba(0,0,0,0.3); border: 1px solid #9b59b6; padding: 8px; border-radius: 4px; display: flex; flex-direction: column; gap: 5px; min-width: 180px; }
        .npc-gen-btn { background: #9b59b6; border: none; color: white; padding: 6px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        #npc-result { font-size: 11px; color: #e1bee7; font-style: italic; min-height: 14px; text-align: center; }

        button.primary-save { background: #2ecc71; border: none; color: white; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 14px; }

        .carousel-container { position: relative; margin: 8px 0; background: #000; border-radius: 4px; overflow: hidden; height: 160px; display: flex; align-items: center; justify-content: center; }
        .carousel-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .carousel-img.active { display: block; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 10px 5px; cursor: pointer; z-index: 5; font-weight: bold; }
        .prev { left: 0; } .next { right: 0; }
        .img-counter { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 10px; font-size: 10px; }

        .leaflet-popup-content-wrapper { background: #162a2e !important; color: white !important; border: 1px solid #447a82; max-width: 280px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 8px 0; font-size: 0.75em; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px; }
        .stat-item b { color: #8eb0b7; display: block; font-size: 0.7em; }
        .popup-desc { border-top: 1px solid #2a4d53; padding-top: 5px; font-size: 0.85em; }
        .dm-info-box { border-top: 1px dashed #e74c3c; margin-top: 8px; padding-top: 8px; color: #ff6b6b; font-size: 0.8em; }
        .popup-controls { display: flex; gap: 5px; margin-top: 10px; border-top: 1px solid #2a4d53; padding-top: 10px; }
        .btn-edit, .btn-delete { border: none; padding: 5px; flex: 1; cursor: pointer; border-radius: 3px; font-size: 10px; color: white; }
        .btn-edit { background: #2a4d53; } .btn-delete { background: #c0392b; }

        /* ---- NYTT: flikar i sidopanelen (Plats / Invånare) ---- */
        .panel-tabs { display: flex; gap: 4px; margin-bottom: 5px; }
        .panel-tab { flex: 1; padding: 8px; background: #0b1d21; border: 1px solid #2a4d53; color: #8eb0b7; cursor: pointer; font-size: 11px; font-weight: bold; border-radius: 4px; }
        .panel-tab.active { background: #2a4d53; color: white; border-color: #447a82; }
        #place-tab-content, #npc-tab-content { display: flex; flex-direction: column; gap: 12px; }

        /* ---- NYTT: NPC-lista under formuläret ---- */
        #npc-list-items { font-size: 11px; color: #8eb0b7; max-height: 220px; overflow-y: auto; margin-top: 5px; background: rgba(0,0,0,0.2); border-radius: 4px; }
        .npc-list-row { padding: 6px 8px; border-bottom: 1px solid #2a4d53; cursor: pointer; }
        .npc-list-row:hover { background: rgba(255,255,255,0.05); }
        #npc-save-status { font-size: 10px; color: #8eb0b7; text-align: center; min-height: 12px; }

        /* ---- NYTT: attributgrid i NPC-formuläret ---- */
        .npc-stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .npc-stat-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .npc-stat-cell label { font-size: 9px; }
        .npc-stat-cell input { text-align: center; padding: 4px 2px; }
        .npc-derived-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="top-bar">
    <div id="filter-bar">
        <button class="filter-btn active" onclick="toggleFilter('all', this)">Alla</button>
        <button class="filter-btn" onclick="toggleFilter('gold', this)">Huvudstad</button>
        <button class="filter-btn" onclick="toggleFilter('blue', this)">Stad</button>
        <button class="filter-btn" onclick="toggleFilter('green', this)">By</button>
        <button class="filter-btn" onclick="toggleFilter('grey', this)">Ruin</button>
        <button class="filter-btn" onclick="toggleFilter('red', this)">Fara</button>
        <button class="filter-btn" onclick="toggleFilter('black', this)">Grotta</button>
        <button class="filter-btn" onclick="toggleFilter('violet', this)">Magi</button>
        <button class="filter-btn" onclick="toggleFilter('orange', this)">Landmärke</button>
        <span id="cloud-status" style="font-size:10px; color:#8eb0b7; margin-left:10px;">Ansluter...</span>
        <span id="content-status" style="font-size:10px; color:#8eb0b7; margin-left:10px;">📚 Laddar innehåll...</span>
    </div>
    <div>
        <button id="add-place-btn" class="dm-only-btn" onclick="togglePlacingMode()">+ Lägg till plats</button>
        <button id="add-npc-btn" class="dm-only-btn" onclick="openNPCTab()">+ Lägg till invånare</button>
        <button id="dm-status" onclick="toggleDM()">🔒 DM LOGIN</button>
    </div>
</div>

<div id="content-row">
    <div id="map"></div>

    <button id="toggle-editor-btn" class="dm-only-btn" onclick="toggleEditorPanel()">◀ REDIGERA</button>
    <button id="back-to-world-btn" style="display:none; position:absolute; top:15px; left:15px; z-index:1002; background:#2a4d53; color:#8eb0b7; border:2px solid #447a82; padding:10px 12px; cursor:pointer; font-size:13px; font-weight:bold; border-radius:5px;" onclick="closeCityMap()">⬅ Till världskartan</button>

    <div id="editor-panel" class="editor-hidden">
        <div class="panel-tabs">
            <button id="tab-place-btn" class="panel-tab active" onclick="switchTab('place')">📍 PLATS</button>
            <button id="tab-npc-btn" class="panel-tab" onclick="switchTab('npc')">👤 INVÅNARE</button>
        </div>

        <div id="place-tab-content">
        <input type="hidden" id="edit-index" value="-1">

        <div class="editor-row">
            <div class="input-group"><label>Namn på plats</label><input type="text" id="node-name"></div>
        </div>
        <div class="editor-row">
            <div class="input-group"><label>Typ</label>
                <select id="node-type">
                    <option value="gold">Huvudstad</option>
                    <option value="blue" selected>Stad</option>
                    <option value="green">By</option>
                    <option value="grey">Ruin</option>
                    <option value="red">Fara</option>
                    <option value="black">Grotta</option>
                    <option value="violet">Magi</option>
                    <option value="orange">Landmärke</option>
                </select>
            </div>
        </div>

        <div class="editor-row">
            <div class="input-group"><label>Pop</label><input type="text" id="node-pop"></div>
            <div class="input-group"><label>Ledare</label><input type="text" id="node-pol"></div>
        </div>
        <div class="editor-row">
            <div class="input-group"><label>Resurs</label><input type="text" id="node-res"></div>
            <div class="input-group"><label>Fara (1-10)</label><input type="text" id="node-danger"></div>
        </div>

        <div class="editor-row">
            <div class="input-group"><label>Kända profiler</label><input type="text" id="node-leaders"></div>
        </div>
        <div class="editor-row">
            <div class="input-group"><label>Bekantskaper</label><input type="text" id="node-allies"></div>
        </div>

        <div class="editor-row">
            <div class="input-group"><label>Bilder (3st URL/Länkar)</label>
                <div style="display:flex; gap:2px;">
                    <input type="text" id="img1" placeholder="Bild 1"><input type="text" id="img2" placeholder="Bild 2"><input type="text" id="img3" placeholder="Bild 3">
                </div>
            </div>
        </div>
        <div class="editor-row">
            <div class="input-group dm-only-field"><label style="color:#ff6b6b">Hemliga Bilder (2st URL)</label>
                <div style="display:flex; gap:2px;">
                    <input type="text" id="dimg1" placeholder="DM 1"><input type="text" id="dimg2" placeholder="DM 2">
                </div>
            </div>
        </div>

        <div class="editor-row">
            <div class="input-group" style="flex: 2;"><label>Beskrivning</label><textarea id="node-desc" rows="2"></textarea></div>
        </div>
        <div class="editor-row">
            <div class="input-group dm-only-field" style="flex: 2;"><label style="color:#ff6b6b">Hemlig DM Info</label><textarea id="node-secret" rows="2"></textarea></div>
        </div>

        <button class="primary-save" onclick="saveToCloud()">SPARA TILL MOLNET</button>
        </div>

        <div id="npc-tab-content" style="display:none;">
            <input type="hidden" id="npc-edit-index" value="-1">

            <div class="editor-row">
                <div class="input-group"><label>Namn</label><input type="text" id="npc-name"></div>
            </div>
            <div class="editor-row">
                <div class="input-group"><label>Kön</label>
                    <select id="npc-gender">
                        <option value="">–</option>
                        <option value="Man">Man</option>
                        <option value="Kvinna">Kvinna</option>
                        <option value="Neutralt">Neutralt</option>
                    </select>
                </div>
                <div class="input-group"><label>Ras</label>
                    <select id="npc-race"><option value="">– Laddar raser... –</option></select>
                </div>
                <div class="input-group"><label>Ålder</label><input type="number" id="npc-age" min="0"></div>
            </div>
            <div class="editor-row">
                <div class="input-group"><label>Yrke</label>
                    <select id="npc-job"><option value="">– Laddar yrken... –</option></select>
                </div>
            </div>
            <div class="editor-row">
                <div class="input-group"><label>Religion</label>
                    <select id="npc-religion"><option value="">– Ingen angiven –</option></select>
                </div>
                <div class="input-group"><label>Ekonomisk status</label>
                    <select id="npc-economy"><option value="">– Ingen angiven –</option></select>
                </div>
            </div>
            <div class="editor-row">
                <div class="input-group"><label>Plats (stad/by)</label>
                    <select id="npc-place"><option value="">– Ingen plats vald –</option></select>
                </div>
                <div class="input-group"><label>Byggnad</label>
                    <select id="npc-building"><option value="">– Välj plats först –</option></select>
                </div>
            </div>
            <div class="editor-row">
                <div class="input-group" style="flex:2;"><label>Utseende</label><textarea id="npc-appearance" rows="2"></textarea></div>
            </div>
            <div class="editor-row">
                <div class="input-group" style="flex:2;"><label>Personlighet</label><textarea id="npc-personality" rows="2"></textarea></div>
            </div>
            <div class="editor-row">
                <div class="input-group"><label>Mål</label><input type="text" id="npc-goal"></div>
            </div>

            <div class="editor-row">
                <div class="input-group" style="flex:2;">
                    <label>Förmågevärden</label>
                    <div class="npc-stat-grid">
                        <div class="npc-stat-cell"><label>STR</label><input type="number" id="npc-str"></div>
                        <div class="npc-stat-cell"><label>DEX</label><input type="number" id="npc-dex"></div>
                        <div class="npc-stat-cell"><label>KON</label><input type="number" id="npc-kon"></div>
                        <div class="npc-stat-cell"><label>INT</label><input type="number" id="npc-int"></div>
                        <div class="npc-stat-cell"><label>VIS</label><input type="number" id="npc-vis"></div>
                        <div class="npc-stat-cell"><label>CHA</label><input type="number" id="npc-cha"></div>
                    </div>
                </div>
            </div>
            <div class="editor-row npc-derived-row">
                <div class="input-group"><label>AC (auto, ändra vid behov)</label><input type="number" id="npc-ac"></div>
                <div class="input-group"><label>HP (auto, ändra vid behov)</label><input type="number" id="npc-hp"></div>
            </div>

            <div class="editor-row">
                <div class="input-group" style="flex:2;"><label>Relationer</label><textarea id="npc-relations" rows="2" placeholder="t.ex. Dotter till Ylva Guldgrävare, Vän: Gregg Handlare"></textarea></div>
            </div>

            <div class="editor-row">
                <div class="input-group" style="flex:2;"><label>Spelaranteckningar (synligt för alla)</label><textarea id="npc-player-notes" rows="2"></textarea></div>
            </div>
            <div class="editor-row">
                <div class="input-group dm-only-field" style="flex:2;"><label style="color:#ff6b6b">DM-hemligheter</label><textarea id="npc-dm-notes" rows="2"></textarea></div>
            </div>

            <button class="npc-gen-btn" style="width:100%; padding:10px; font-size:12px;" onclick="randomizeNPC()">🎲 SLUMPA ALLT</button>
            <button class="primary-save" onclick="saveNPCToCloud()">SPARA INVÅNARE</button>
            <button class="btn-delete" style="width:100%; padding:8px; border-radius:4px;" onclick="deleteNPC()">RADERA VALD INVÅNARE</button>
            <div id="npc-save-status"></div>

            <div style="margin-top:10px; border-top:1px solid #2a4d53; padding-top:10px;">
                <label>Sparade invånare</label>
                <div id="npc-list-items"><i style="padding:8px; display:block;">Inga invånare sparade än.</i></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzUaFvJSvqZI9eGP_I_zXMoPdQYp5uQEkUwRqW0ypKLtduXJyoRXIokLaD0-WqHmJqg/exec";
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: -2, maxZoom: 2, attributionControl: false });
    var worldBounds = [[0, 0], [2887, 3840]];
    var worldImageLayer = L.imageOverlay('VASTERHEIM.webp', worldBounds).addTo(map);
    map.fitBounds(worldBounds);

    var isDM = false, savedData = [], activeFilter = 'all', currentCoords = null;

    const firstNames = ["Erik", "Alva", "Gunnar", "Sigrid", "Ivar", "Helga", "Björn", "Astrid", "Rolf", "Ingrid", "Tor", "Svea", "Olof", "Freja", "Knut", "Ylva", "Harald", "Ragnhild", "Leif", "Eira"];
    const lastNames = ["Järnhand", "Stenskalle", "Falköga", "Ekrot", "Sjöfarare", "Korpunge", "Björnbane", "Vindlöpare", "Guldgrävare", "Frostskägg", "Pilbåge", "Hammarslag", "Nattvandrare", "Ulvtand", "Bergfast", "Eldsjäl", "Skarpsyn", "Gråkappa", "Blodsyxa", "Vildhjärta"];
    const roles = ["Smed", "Värdshusvärd", "Vakt", "Präst", "Tjuv", "Magiker", "Bonde", "Jägare", "Handlare", "Läkare", "Kapten", "Lärling", "Siareska", "Bibliotekarie", "Fiskare", "Soldat", "Snickare", "Skalden", "Alkemist", "Spion"];

    // ---- Kvar hårdkodat: utseendebeskrivningar (ingen egen Sheets-flik för detta ännu) ----
    const appearanceBuilds = ["smal", "kraftigt byggd", "muskulös", "spenslig", "undersätsig", "reslig", "böjd av ålder", "atletisk", "senig"];
    const appearanceEyes = ["stålgrå", "djupbruna", "isblå", "bärnstensfärgade", "gröna", "svarta som natten", "olikfärgade"];
    const appearanceFeatures = ["ett ärr över ena ögonbrynet", "tatueringar längs underarmarna", "gråsprängt hår", "ett brutet näsben som läkt snett", "fräknar över hela ansiktet", "en påfallande djup röst", "ovanligt långa fingrar", "ett saknat finger", "guldbrickor inflätade i skägget", "en käpp av mörkt trä", "solbränd hy", "ett konstant road uttryck"];
    const hairColors = ["svart", "kolsvart", "mörkbrunt", "ljusbrunt", "mörkblont", "ljust blont", "rött", "rödblont", "grått", "silverfärgat", "vitt", "kopparrött"];
    const raceHeightRanges = {
        "Människa": [155, 195], "Alv": [150, 185], "Dvärg": [120, 145], "Halvling": [85, 120],
        "Halvalv": [155, 188], "Halvork": [165, 205], "Drakfödd": [175, 210], "Tiefling": [160, 192],
        "Gnom": [85, 110], "Ork": [175, 210]
    };

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function pickN(arr, n) {
        const copy = [...arr], out = [];
        for (let i = 0; i < n && copy.length; i++) out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
        return out;
    }
    function generateAppearanceText(ras) {
        const range = raceHeightRanges[ras] || [150, 195];
        const height = Math.floor(range[0] + Math.random() * (range[1] - range[0]));
        return `${height} cm lång, ${pick(appearanceBuilds)} kroppsbyggnad, ${pick(hairColors)} hår och ${pick(appearanceEyes)} ögon. Har ${pick(appearanceFeatures)}.`;
    }

    // ============================================================
    // NYTT: Innehållsbank - läses från Google Sheets istället för
    // hårdkodade listor. DM redigerar direkt i kalkylarket, appen
    // läser senaste versionen varje gång sidan laddas.
    // ============================================================
    var contentBank = {
        namesByRaceGender: {}, surnamesByRace: {}, racesInfo: {}, raceStatMods: {},
        yrken: [], personalityPool: [], goalsPool: [], religions: [], econStatuses: [],
        statsSettings: { min: 3, max: 18, baseline: 10, variation: 3 },
        buildings: [], buildingTypes: [], familyJobChance: {}, relationTypes: [],
        loaded: false
    };

    const HYBRID_PARENTS = { "Halvalv": ["Alv", "Människa"], "Halvork": ["Ork", "Människa"] };

    // ---- NYTT: hämta flera flikar i ETT anrop (mycket snabbare än 14 separata) ----
    async function fetchMultipleSheets(names) {
        const empty = {}; names.forEach(n => empty[n] = []);
        const res = await fetch(scriptURL + "?sheets=" + names.map(encodeURIComponent).join(","));
        const data = await res.json();
        const result = {};
        names.forEach(name => {
            const rows = data[name] || [];
            result[name] = rows.slice(1).filter(r => r && r.some(v => v !== "" && v !== null && v !== undefined));
        });
        return result;
    }

    async function loadContentBank() {
        const contentStatus = document.getElementById('content-status');
        const genBtn = document.querySelector('.npc-gen-btn');
        if (genBtn) { genBtn.disabled = true; genBtn.innerText = "⏳ Laddar innehåll..."; }
        if (contentStatus) contentStatus.innerText = "📚 Laddar innehåll...";

        try {
            const sheetNames = ["Fornamn","Efternamn","Raser","Yrken","Personlighetsdrag","Mal","Religioner",
                "EkonomiskStatus","StatsInstallningar","GrundstatsPerRas","Byggnader","Byggnadstyper",
                "ByggnadstyperFamiljejobb","Relationstyper"];
            const sheets = await fetchMultipleSheets(sheetNames);
            const fornamn = sheets["Fornamn"], efternamn = sheets["Efternamn"], raser = sheets["Raser"], yrken = sheets["Yrken"],
                  personlighet = sheets["Personlighetsdrag"], mal = sheets["Mal"], religioner = sheets["Religioner"],
                  ekonomi = sheets["EkonomiskStatus"], statsInst = sheets["StatsInstallningar"], grundstats = sheets["GrundstatsPerRas"],
                  byggnader = sheets["Byggnader"], byggnadstyper = sheets["Byggnadstyper"], familjejobb = sheets["ByggnadstyperFamiljejobb"],
                  relationstyper = sheets["Relationstyper"];

            fornamn.forEach(row => {
                const [namn, kon, ras] = row;
                if (!namn || !ras) return;
                if (!contentBank.namesByRaceGender[ras]) contentBank.namesByRaceGender[ras] = {};
                if (!contentBank.namesByRaceGender[ras][kon]) contentBank.namesByRaceGender[ras][kon] = [];
                contentBank.namesByRaceGender[ras][kon].push(namn);
            });

            efternamn.forEach(row => {
                const [namn, ras] = row;
                if (!namn || !ras) return;
                if (!contentBank.surnamesByRace[ras]) contentBank.surnamesByRace[ras] = [];
                contentBank.surnamesByRace[ras].push(namn);
            });

            raser.forEach(row => {
                const [ras, vuxenFran, livslangd, andelBarn] = row;
                if (!ras) return;
                contentBank.racesInfo[ras] = {
                    vuxenFran: parseFloat(vuxenFran) || 18,
                    livslangd: parseFloat(livslangd) || 80,
                    andelBarn: parseFloat(andelBarn) || 15
                };
            });

            contentBank.yrken = yrken.map(r => r[0]).filter(Boolean);
            contentBank.personalityPool = personlighet.map(r => r[0]).filter(Boolean);
            contentBank.goalsPool = mal.map(r => r[0]).filter(Boolean);
            contentBank.religions = religioner.map(r => ({ namn: r[0], beskrivning: r[1] })).filter(r => r.namn);
            contentBank.econStatuses = ekonomi.map(r => ({ niva: r[0], vikt: parseFloat(r[1]) || 1 })).filter(r => r.niva);

            statsInst.forEach(row => {
                const [namn, varde] = row;
                if (!namn) return;
                const v = parseFloat(varde);
                if (isNaN(v)) return;
                const key = String(namn).toLowerCase();
                if (key.includes("min")) contentBank.statsSettings.min = v;
                else if (key.includes("max")) contentBank.statsSettings.max = v;
                else if (key.includes("baslinje")) contentBank.statsSettings.baseline = v;
                else if (key.includes("variation")) contentBank.statsSettings.variation = v;
            });

            grundstats.forEach(row => {
                const [ras, str, dex, kon, intt, vis, cha] = row;
                if (!ras) return;
                contentBank.raceStatMods[ras] = {
                    STR: parseFloat(str) || 0, DEX: parseFloat(dex) || 0, KON: parseFloat(kon) || 0,
                    INT: parseFloat(intt) || 0, VIS: parseFloat(vis) || 0, CHA: parseFloat(cha) || 0
                };
            });

            loadBuildingBank(byggnader, byggnadstyper, familjejobb, relationstyper);

            contentBank.loaded = true;
            populateNPCDropdowns();
            if (genBtn) { genBtn.disabled = false; genBtn.innerText = "🎲 SLUMPA ALLT"; }
            if (contentStatus) contentStatus.innerText = "✅ Innehåll redo";
        } catch (e) {
            console.error("Fel vid laddning av innehållsbank", e);
            if (contentStatus) contentStatus.innerText = "❌ Fel vid laddning - ladda om sidan";
            if (genBtn) { genBtn.disabled = false; genBtn.innerText = "🎲 SLUMPA ALLT"; }
        }
    }

    // ---- NYTT: Byggnader, Byggnadstyper, familjejobb-sannolikhet, relationstyper ----
    function loadBuildingBank(byggnader, byggnadstyper, familjejobb, relationstyper) {
        // Byggnader: Stad, Byggnadsnamn, Typ, Yrke, Ungefär antal invånare, X, Y
        contentBank.buildings = byggnader.map(r => ({
            stad: r[0] || "", namn: r[1] || "", typ: r[2] || "", yrke: r[3] || "",
            antal: parseInt(r[4]) || 1,
            x: (r[5] !== undefined && r[5] !== "") ? parseFloat(r[5]) : null,
            y: (r[6] !== undefined && r[6] !== "") ? parseFloat(r[6]) : null
        })).filter(b => b.stad && b.namn);

        // Byggnadstyper: Typ, Vikt, Vanligt yrke, Minsta befolkning, Max normalt, Max storstad
        contentBank.buildingTypes = byggnadstyper.map(r => ({
            typ: r[0] || "", vikt: parseFloat(r[1]) || 1, yrke: r[2] || "",
            minPop: parseFloat(r[3]) || 0, maxNormal: r[4] !== "" ? parseFloat(r[4]) : null,
            maxStor: r[5] !== "" ? parseFloat(r[5]) : null
        })).filter(t => t.typ);

        // ByggnadstyperFamiljejobb: Typ, % Familjen jobbar i företaget
        contentBank.familyJobChance = {};
        familjejobb.forEach(r => {
            if (r[0]) contentBank.familyJobChance[r[0]] = parseFloat(r[1]) || 30;
        });

        // Relationstyper: Relationstyp
        contentBank.relationTypes = relationstyper.map(r => r[0]).filter(Boolean);
    }

    // ============================================================
    // NYTT: Stadskarta - klickbara byggnader inom en stad, visar
    // vilka NPC:er som bor/jobbar där. Ingen bakgrundsbild ännu,
    // bara utspridda punkter på en tom yta.
    // ============================================================
    var cityViewActive = false;
    var currentCityName = null;
    var CITY_CANVAS_SIZE = 1000;

    function ensureBuildingCoords(cityName) {
        let changed = false;
        contentBank.buildings.filter(b => b.stad === cityName).forEach(b => {
            if (b.x == null || b.y == null || isNaN(b.x) || isNaN(b.y)) {
                b.x = Math.round(50 + Math.random() * (CITY_CANVAS_SIZE - 100));
                b.y = Math.round(50 + Math.random() * (CITY_CANVAS_SIZE - 100));
                changed = true;
            }
        });
        return changed;
    }

    async function saveBuildingsToCloud() {
        const BUILDING_HEADERS = ["Stad", "Byggnadsnamn", "Typ", "Yrke", "Ungefär antal invånare", "X", "Y"];
        const output = [BUILDING_HEADERS, ...contentBank.buildings.map(b => [b.stad, b.namn, b.typ, b.yrke, b.antal, b.x, b.y])];

    async function openCityMap(cityName) {
        if (!contentBank.loaded) return alert("Innehållet laddas fortfarande - försök igen om en liten stund.");
        const buildings = contentBank.buildings.filter(b => b.stad === cityName);
        if (!buildings.length) return alert("Inga byggnader hittades för " + cityName + " än. Lägg till några i Byggnader-fliken, eller kör 'Generera befolkning' först.");

        map.closePopup();
        cityViewActive = true;
        currentCityName = cityName;

        map.removeLayer(worldImageLayer);
        map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });

        const needsSave = ensureBuildingCoords(cityName);
        if (needsSave) await saveBuildingsToCloud();

        const cityBounds = [[0, 0], [CITY_CANVAS_SIZE, CITY_CANVAS_SIZE]];
        map.fitBounds(cityBounds);

        document.getElementById('back-to-world-btn').style.display = 'block';
        renderCityMarkers();
    }

    function closeCityMap() {
        cityViewActive = false;
        currentCityName = null;
        map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
        if (!map.hasLayer(worldImageLayer)) worldImageLayer.addTo(map);
        map.fitBounds(worldBounds);
        document.getElementById('back-to-world-btn').style.display = 'none';
        renderMarkers();
    }

    function renderCityMarkers() {
        const buildings = contentBank.buildings.filter(b => b.stad === currentCityName);

            });

    // ---- Namn/ras-slump med arv för blandraser (Halvalv/Halvork) ----
    function pickFirstName(ras, kon) {
        let pool = contentBank.namesByRaceGender[ras] && contentBank.namesByRaceGender[ras][kon];
        if ((!pool || !pool.length) && HYBRID_PARENTS[ras]) {
            const parentRace = pick(HYBRID_PARENTS[ras]);
            pool = contentBank.namesByRaceGender[parentRace] && contentBank.namesByRaceGender[parentRace][kon];
        }
        if (!pool || !pool.length) pool = contentBank.namesByRaceGender["Människa"] && contentBank.namesByRaceGender["Människa"][kon];
        return pool && pool.length ? pick(pool) : "Namnlös";
    }
    function pickSurname(ras) {
        let pool = contentBank.surnamesByRace[ras];
        if ((!pool || !pool.length) && HYBRID_PARENTS[ras]) {
            const parentRace = pick(HYBRID_PARENTS[ras]);
            pool = contentBank.surnamesByRace[parentRace];
        }
        if (!pool || !pool.length) pool = contentBank.surnamesByRace["Människa"];
        return pool && pool.length ? pick(pool) : "";
    }
    function pickGenderForRace(ras) {
        let genders = Object.keys(contentBank.namesByRaceGender[ras] || {});
        if (!genders.length && HYBRID_PARENTS[ras]) {
            for (const p of HYBRID_PARENTS[ras]) {
                genders = Object.keys(contentBank.namesByRaceGender[p] || {});
                if (genders.length) break;
            }
        }
        if (!genders.length) genders = ["Man", "Kvinna"];
        return pick(genders);
    }

    // ---- Ålder, baserat på rasens vuxenålder/livslängd/andel barn ----
    function generateAge(ras) {
        const info = contentBank.racesInfo[ras];
        if (!info) return "";
        const isChild = Math.random() * 100 < info.andelBarn;
        if (isChild) return Math.max(1, Math.floor(Math.random() * info.vuxenFran));
        return Math.floor(info.vuxenFran + Math.random() * Math.max(1, info.livslangd - info.vuxenFran));
    }

    // ---- Förmågevärden: rasens baslinje + individuell slumpvariation ----
    function abilityMod(score) { return Math.floor((score - 10) / 2); }
    function generateStats(ras) {
        const mods = contentBank.raceStatMods[ras] || {};
        const s = contentBank.statsSettings;
        const stats = {};
        ["STR", "DEX", "KON", "INT", "VIS", "CHA"].forEach(key => {
            const variation = Math.floor(Math.random() * (s.variation * 2 + 1)) - s.variation;
            let val = s.baseline + (mods[key] || 0) + variation;
            val = Math.max(s.min, Math.min(s.max, val));
            stats[key] = val;
        });
        return stats;
    }
    const COMBAT_JOB_KEYWORDS = ["krigare","soldat","kapten","riddare","äventyrare","sheriff","kämpe","general","officer","bandit","ligist","livvakt","försvarare","gladiator","vakt"];
    const PHYSICAL_JOB_KEYWORDS = ["smed","bonde","jägare","fiskare","snickare","murare","gruvarbetare","timmerhuggare","slaktare","garvare","stenhuggare","hamnarbetare","tjuv","spion","sjöman","flottare","färjeman","brunnsgrävare","sadelmakare","tunnbindare","krukmakare","vagnmakare"];

    function getHPTier(yrke) {
        const y = (yrke || "").toLowerCase();
        if (COMBAT_JOB_KEYWORDS.some(k => y.includes(k))) return "hog";
        if (PHYSICAL_JOB_KEYWORDS.some(k => y.includes(k))) return "medel";
        return "lag";
    }
    function deriveDerivedStats(stats, yrke) {
        const ac = 10 + abilityMod(stats.DEX);
        const tier = getHPTier(yrke);
        let base;
        if (tier === "hog") base = 60 + Math.floor(Math.random() * 41);      // 60-100
        else if (tier === "medel") base = 25 + Math.floor(Math.random() * 31); // 25-55
        else base = 10 + Math.floor(Math.random() * 26);                     // 10-35
        let hp = base + abilityMod(stats.KON);
        hp = Math.max(10, Math.min(100, hp));
        return { ac, hp };
    }
    function weightedPick(items, weightFn) {
        const total = items.reduce((s, i) => s + weightFn(i), 0);
        let r = Math.random() * total;
        for (const item of items) { r -= weightFn(item); if (r <= 0) return item; }
        return items[items.length - 1];
    }

    function formatImgUrl(url, folder) {
        if(!url) return null;
        let clean = url.trim();
        if(clean.toLowerCase().startsWith('http')) {
            if(clean.includes('drive.google.com')) return clean.replace('/file/d/', '/uc?export=view&id=').split('/view')[0];
            return clean;
        }
        return clean.includes('/') ? `./${clean}` : `./${folder}/${clean}`;
    }

    async function loadFromCloud() {
        document.getElementById('cloud-status').innerText = "⏳ Synkar...";

            savedData = data.slice(1).map(row => ({

                leaders: row[8]||"", allies: row[9]||"", desc: row[10]||"", secret: row[11]||"",
                img1: row[12], img2: row[13], img3: row[14], dimg1: row[17], dimg2: row[18]
            }));
            renderMarkers();
            populateNPCPlaceDropdown();
            document.getElementById('cloud-status').innerText = "✅ Synkad";

    async function saveToCloud() {
        const name = document.getElementById('node-name').value;
        if(!currentCoords || !name) return alert("Välj plats på kartan och skriv ett namn!");

        const p = {
            name: name, type: document.getElementById('node-type').value, lat: currentCoords[0], lng: currentCoords[1],
            pop: document.getElementById('node-pop').value, pol: document.getElementById('node-pol').value,
            res: document.getElementById('node-res').value, danger: document.getElementById('node-danger').value,
            leaders: document.getElementById('node-leaders').value, allies: document.getElementById('node-allies').value,
            desc: document.getElementById('node-desc').value, secret: document.getElementById('node-secret').value,
            img1: document.getElementById('img1').value, img2: document.getElementById('img2').value, img3: document.getElementById('img3').value,
            dimg1: document.getElementById('dimg1').value, dimg2: document.getElementById('dimg2').value
        };

        const idx = parseInt(document.getElementById('edit-index').value);
        if (idx > -1) savedData[idx] = p; else savedData.push(p);

        const output = [["Rubrik"], ...savedData.map(m => [m.name, m.type, m.lat||m.coords[0], m.lng||m.coords[1], m.pop, m.pol, m.res, m.danger, m.leaders, m.allies, m.desc, m.secret, m.img1, m.img2, m.img3, "", "", m.dimg1, m.dimg2, "", "", ""])];

        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(output) });

        document.getElementById('edit-index').value = "-1";
        document.getElementById('cloud-status').innerText = "✅ Sparat";
        renderMarkers();
        setEditorOpen(false);
    }

    function renderMarkers() {
        map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
        savedData.forEach((m, i) => {
            if (activeFilter !== 'all' && m.type !== activeFilter) return;
            let urls = [formatImgUrl(m.img1, "Bilder"), formatImgUrl(m.img2, "Bilder"), formatImgUrl(m.img3, "Bilder")].filter(x => x);
            if(isDM) urls = [...urls, formatImgUrl(m.dimg1, "DM_Bilder"), formatImgUrl(m.dimg2, "DM_Bilder")].filter(x => x);

            let carousel = "";
            if(urls.length > 0) {
                carousel = `<div class="carousel-container">${urls.length>1?'<button class="nav-btn prev" onclick="changeImg(this,-1)">&#10094;</button>':''}`;
                urls.forEach((u,idx) => carousel += `<img src="${u}" class="carousel-img ${idx===0?'active':''}">`);
                carousel += `${urls.length>1?'<button class="nav-btn next" onclick="changeImg(this,1)">&#10095;</button><div class="img-counter">1/'+urls.length+'</div>':''}</div>`;
            }

            let content = `<div style="color:white;"><b style="color:#2ecc71; font-size:1.2em;">${m.name}</b>${carousel}<div class="stat-grid"><div class="stat-item"><b>Pop</b>${m.pop||'-'}</div><div class="stat-item"><b>Ledare</b>${m.pol||'-'}</div><div class="stat-item"><b>Resurs</b>${m.res||'-'}</div><div class="stat-item"><b>Fara</b>${m.danger||'-'}</div><div class="stat-item" style="grid-column:span 2"><b>Profiler</b>${m.leaders||'-'}</div><div class="stat-item" style="grid-column:span 2"><b>Bekanta</b>${m.allies||'-'}</div></div><p class="popup-desc">${m.desc||''}</p>`;
            if (['gold','blue','green'].includes(m.type)) {
                content += `<button class="npc-gen-btn" style="width:100%; margin-top:8px; padding:8px; background:#2a4d53;" onclick="openCityMap('${m.name.replace(/'/g,"\\'")}')">🏙️ Öppna stadskarta</button>`;
            }
            if(isDM) {
                content += `<div class="dm-info-box"><b>DM INFO:</b> ${m.secret||''}</div><div class="popup-controls"><button class="btn-edit" onclick="prepareEdit(${i})">ÄNDRA</button><button class="btn-delete" onclick="deletePoint(${i})">RADERA</button></div>`;
                if (['gold','blue','green'].includes(m.type)) {
                    content += `<button class="npc-gen-btn" style="width:100%; margin-top:8px; padding:8px;" onclick="generatePopulation('${m.name.replace(/'/g,"\\'")}')">🏘️ Generera befolkning</button>`;
                }
            }
            L.marker(m.coords, {icon: getIcon(m.type)}).addTo(map).bindPopup(content, {maxWidth: 260});
        });
    }

    async function deletePoint(idx) {

    savedData.splice(idx, 1);
    document.getElementById('cloud-status').innerText = "📤 Raderar...";

    ])];

        await fetch(scriptURL, {

            mode: 'no-cors',
            body: JSON.stringify(output)
        });

        setTimeout(() => {

}

    function changeImg(btn, d) {
        const c = btn.parentElement; const imgs = c.querySelectorAll('.carousel-img');
        let cur = 0; imgs.forEach((img, i) => { if(img.classList.contains('active')) cur = i; });
        imgs[cur].classList.remove('active');
        let nxt = (cur + d + imgs.length) % imgs.length;
        imgs[nxt].classList.add('active');
        c.querySelector('.img-counter').innerText = (nxt + 1) + "/" + imgs.length;
    }

    function getIcon(c) { return new L.Icon({ iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${c}.png`, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] }); }

    // ---- NYTT: en gemensam funktion som öppnar/stänger sidopanelen och håller knappen synkad ----
    function setEditorOpen(open) {
        const panel = document.getElementById('editor-panel');
        const btn = document.getElementById('toggle-editor-btn');
        if (open) {
            panel.classList.remove('editor-hidden');
            btn.classList.add('panel-open');

    // ============================================================
    // NYTT: Befolkningsgenerator. Fyller en stads byggnader med
    // hela hushåll (ägare + familj) och kopplar ihop relationer,
    // baserat på Byggnader/Byggnadstyper/ByggnadstyperFamiljejobb.
    // ============================================================
    async function generatePopulation(cityName) {
        if (!contentBank.loaded) return alert("Innehållet laddas fortfarande - försök igen om en liten stund.");
        const city = savedData.find(m => m.name === cityName);
        const cityPop = city ? (parseInt(city.pop) || 0) : 0;

        const raceNames = Object.keys(contentBank.racesInfo);
        const dominantRace = prompt(
            `Vilken ras befolkar ${cityName} till störst del?\n\nTillgängliga raser: ${raceNames.join(", ")}\n\n(Lämna tomt för helt jämn fördelning mellan alla raser.)`,
            raceNames.includes("Människa") ? "Människa" : (raceNames[0] || "")
        );
        let dominantPct = 0;
        if (dominantRace && raceNames.includes(dominantRace)) {
            const pctStr = prompt(`Hur stor andel av hushållen ska vara ${dominantRace}? (0-100)`, "60");
            dominantPct = Math.max(0, Math.min(100, parseInt(pctStr) || 0));
        }
        function pickHouseholdRace() {
            if (dominantRace && Math.random() * 100 < dominantPct) return dominantRace;
            const others = raceNames.filter(r => r !== dominantRace);
            return pick(others.length ? others : raceNames);
        }

        function suggestBuildingCount(pop) {
            if (!pop) return 15;
            if (pop <= 75) return Math.max(8, Math.round(pop / 4));
            if (pop <= 300) return Math.round(20 + (pop - 75) / 225 * 20);
            if (pop <= 1500) return Math.round(40 + (pop - 300) / 1200 * 20);
            if (pop <= 6000) return Math.round(60 + (pop - 1500) / 4500 * 30);
            if (pop <= 20000) return Math.round(90 + (pop - 6000) / 14000 * 40);
            return 130 + Math.min(20, Math.round((pop - 20000) / 15000 * 10));
        }
        const suggestedCount = suggestBuildingCount(cityPop);

        const extraStr = prompt(
            `${cityName} har redan ${contentBank.buildings.filter(b => b.stad === cityName).length} byggnader i Byggnader-fliken.\n\n` +
            `Hur många NYA byggnader vill du att jag genererar automatiskt?\n\n` +
            (cityPop ? `Baserat på ${cityPop} invånare föreslår jag ${suggestedCount} st (se tumregeltabellen du fått i chatten).` : `Ingen befolkningssiffra angiven på staden - föreslår ett standardantal.`),
            String(suggestedCount)
        );
        if (extraStr === null) return;
        const extraCount = Math.max(0, Math.min(150, parseInt(extraStr) || 0));

        const existingBuildings = contentBank.buildings.filter(b => b.stad === cityName);
        const newBuildings = [];

        function makeBuilding(typ, yrke) {
            const raceForName = pickHouseholdRace();
            const surname = pickSurname(raceForName) || "Okänd";
            const namn = typ === "Hem" ? `${surname}s Hem` : `${surname}s ${typ}`;
            return { stad: cityName, namn, typ, yrke: yrke || "", antal: typ === "Hem" ? (1 + Math.floor(Math.random() * 4)) : (1 + Math.floor(Math.random() * 3)) };
        }

        let remaining = extraCount;
        if (extraCount > 0) {
            // ---- Garantera grundläggande byggnadstyper innan resten slumpas viktat ----
            const ESSENTIAL_TYPES = ["Taverna", "Handelsbod", "Smedja"];
            const existingTypes = new Set(existingBuildings.map(b => b.typ));
            ESSENTIAL_TYPES.forEach(typ => {
                if (remaining <= 0 || existingTypes.has(typ)) return;
                const typeInfo = contentBank.buildingTypes.find(t => t.typ === typ);
                if (typeInfo && cityPop && cityPop < typeInfo.minPop) return; // för liten befolkning ens för basbyggnaden
                newBuildings.push(makeBuilding(typ, typeInfo ? typeInfo.yrke : ""));
                existingTypes.add(typ);
                remaining--;
            });
        }

        if (remaining > 0) {
            const isStor = cityPop >= 10000;
            const usedCounts = {};
            existingBuildings.concat(newBuildings).forEach(b => { usedCounts[b.typ] = (usedCounts[b.typ] || 0) + 1; });

            for (let i = 0; i < remaining; i++) {
                const eligible = contentBank.buildingTypes.filter(t => {
                    if (cityPop && cityPop < t.minPop) return false;
                    const cap = isStor ? t.maxStor : t.maxNormal;
                    if (cap != null && (usedCounts[t.typ] || 0) >= cap) return false;
                    return true;
                });
                if (!eligible.length) break;
                const chosen = weightedPick(eligible, t => t.vikt);
                usedCounts[chosen.typ] = (usedCounts[chosen.typ] || 0) + 1;
                newBuildings.push(makeBuilding(chosen.typ, chosen.yrke));
            }
        }

        if (!existingBuildings.length && !newBuildings.length) return alert("Inga byggnader att generera invånare för - lägg till minst en byggnad eller ett antal nya.");

        if (!confirm(`Skapa hushåll för ${existingBuildings.length} befintliga + ${newBuildings.length} nya byggnader i ${cityName}?\n\nDetta LÄGGER TILL nya invånare (skriver inte över befintliga).`)) return;

        contentBank.buildings = contentBank.buildings.concat(newBuildings);
        const allBuildingsForCity = existingBuildings.concat(newBuildings);

        const newNPCs = [];

        allBuildingsForCity.forEach(b => {
            const raceForHousehold = pickHouseholdRace();
            const count = Math.max(1, b.antal || 1);
            const householdMembers = []; // index i newNPCs för denna byggnads invånare

            for (let i = 0; i < count; i++) {
                const ras = raceForHousehold;
                const info = contentBank.racesInfo[ras];
                let isChild = false;
                let yrke = "";

                if (i === 0 && b.yrke) {
                    yrke = b.yrke; // ägaren får byggnadens angivna yrke
                } else {
                    isChild = info && Math.random() * 100 < info.andelBarn;
                    if (!isChild) {
                        if (b.yrke) {
                            const chance = contentBank.familyJobChance[b.typ] != null ? contentBank.familyJobChance[b.typ] : 30;
                            yrke = (Math.random() * 100 < chance) ? b.yrke : (contentBank.yrken.length ? pick(contentBank.yrken) : "");
                        } else {
                            yrke = contentBank.yrken.length ? pick(contentBank.yrken) : "";
                        }
                    }
                }

                const gender = pickGenderForRace(ras);
                const fornamn = pickFirstName(ras, gender);
                const efternamn = pickSurname(ras);
                const alder = isChild
                    ? Math.max(1, Math.floor(Math.random() * ((info && info.vuxenFran) || 18)))
                    : generateAge(ras);
                const stats = generateStats(ras);
                const derived = deriveDerivedStats(stats, yrke);
                const religion = contentBank.religions.length ? pick(contentBank.religions).namn : "";
                const ekonomi = contentBank.econStatuses.length ? weightedPick(contentBank.econStatuses, e => e.vikt).niva : "";

                newNPCs.push({
                    name: (fornamn + " " + efternamn).trim(), gender, race: ras, age: alder, job: yrke,
                    appearance: generateAppearanceText(ras),
                    personality: contentBank.personalityPool.length ? pickN(contentBank.personalityPool, 3).join(", ") : "",
                    religion, economy: ekonomi,
                    goal: contentBank.goalsPool.length ? pick(contentBank.goalsPool) : "",
                    str: stats.STR, dex: stats.DEX, kon: stats.KON, int: stats.INT, vis: stats.VIS, cha: stats.CHA,
                    ac: derived.ac, hp: derived.hp,
                    place: cityName, building: b.namn, relations: "", dmNotes: "", playerNotes: "",
                    _isChild: isChild
                });
                householdMembers.push(newNPCs.length - 1);
            }

            // ---- Relationer inom hushållet ----
            if (householdMembers.length > 1) {
                const ownerIdx = householdMembers[0];
                const rest = householdMembers.slice(1);
                let partnerIdx = null;
                rest.forEach((idx, pos) => {
                    const person = newNPCs[idx];
                    const owner = newNPCs[ownerIdx];
                    if (person._isChild) {
                        appendRelation(person, `Barn till ${owner.name}`);
                        appendRelation(owner, `Förälder till ${person.name}`);
                    } else if (partnerIdx === null) {
                        partnerIdx = idx;
                        appendRelation(person, `Partner till ${owner.name}`);
                        appendRelation(owner, `Partner till ${person.name}`);
                    } else {
                        appendRelation(person, `Syskon till ${owner.name}`);
                        appendRelation(owner, `Syskon till ${person.name}`);
                    }
                });
            }
        });

        // ---- Ett fåtal slumpade relationer MELLAN olika byggnader (vänner/rivaler) ----
        if (contentBank.relationTypes.length && newNPCs.length > 3) {
            const extraLinks = Math.min(Math.floor(newNPCs.length / 4), 15);
            for (let i = 0; i < extraLinks; i++) {
                const a = Math.floor(Math.random() * newNPCs.length);
                const b2 = Math.floor(Math.random() * newNPCs.length);
                if (a === b2 || newNPCs[a].building === newNPCs[b2].building) continue;
                const relType = pick(contentBank.relationTypes);
                appendRelation(newNPCs[a], `${relType}: ${newNPCs[b2].name}`);
            }
        }

        newNPCs.forEach(n => delete n._isChild);
        savedNPCs = savedNPCs.concat(newNPCs);

        document.getElementById('cloud-status').innerText = "📤 Sparar befolkning...";
        const output = [NPC_HEADERS, ...savedNPCs.map(npcToRow)];
        await fetch(scriptURL + "?sheet=Invanare", { method: 'POST', mode: 'no-cors', body: JSON.stringify(output) });

        if (newBuildings.length) {
            const BUILDING_HEADERS = ["Stad", "Byggnadsnamn", "Typ", "Yrke", "Ungefär antal invånare", "X", "Y"];
            const buildingOutput = [BUILDING_HEADERS, ...contentBank.buildings.map(b => [b.stad, b.namn, b.typ, b.yrke, b.antal, b.x != null ? b.x : "", b.y != null ? b.y : ""])];
            await fetch(scriptURL + "?sheet=Byggnader", { method: 'POST', mode: 'no-cors', body: JSON.stringify(buildingOutput) });
        }

        document.getElementById('cloud-status').innerText = "✅ Klart";

        renderNPCList();
        alert(`Klart! ${newNPCs.length} invånare skapade i ${cityName} (${newBuildings.length} nya byggnader tillagda).`);
    }

    function appendRelation(npc, text) {
        npc.relations = npc.relations ? (npc.relations + "; " + text) : text;
    }

    loadFromCloud();
    loadNPCsFromCloud();
    loadContentBank();
